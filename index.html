<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cohete de agua: vuelos de prueba</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <span class="logo">🚀</span>
  <h1>Cohete de agua · Vuelos de prueba</h1>
</header>

<main class="layout">
  <section class="watch">
    <div class="player" id="player" tabindex="0">
      <video id="video" playsinline preload="metadata"></video>

      <button class="big-play" id="bigPlay" aria-label="Reproducir">
        <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <div class="controls" id="controls">
        <div class="progress" id="progress" role="slider" aria-label="Progreso" tabindex="0">
          <div class="buffer" id="buffer"></div>
          <div class="played" id="played"></div>
          <div class="knob" id="knob"></div>
          <div class="tip" id="tip">0:00</div>
        </div>

        <div class="bar">
          <button id="btnPlay" aria-label="Reproducir o pausar">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
          </button>
          <button id="btnNext" aria-label="Siguiente vuelo">
            <svg viewBox="0 0 24 24"><path d="M6 6l9 6-9 6zM16 6h2v12h-2z"/></svg>
          </button>
          <div class="vol">
            <button id="btnMute" aria-label="Silenciar">
              <svg class="i-vol" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
              <svg class="i-mute" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM16 9.4l1.4-1.4 2.6 2.6L22.6 8 24 9.4 21.4 12 24 14.6 22.6 16 20 13.4 17.4 16 16 14.6 18.6 12z"/></svg>
            </button>
            <input type="range" id="volume" min="0" max="1" step="0.05" value="1" aria-label="Volumen">
          </div>
          <span class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></span>
          <span class="spacer"></span>

          <div class="menu-wrap">
            <button id="btnSpeed" class="txt" aria-label="Velocidad">1×</button>
            <ul class="menu" id="speedMenu" hidden>
              <li data-s="0.25">0,25×</li>
              <li data-s="0.5">0,5×</li>
              <li data-s="1" class="on">Normal</li>
              <li data-s="1.5">1,5×</li>
              <li data-s="2">2×</li>
            </ul>
          </div>
          <button id="btnFs" aria-label="Pantalla completa">
            <svg class="i-fs" viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5zM14 5h5v5h-2V7h-3zM5 14h2v3h3v2H5zM17 14h2v5h-5v-2h3z"/></svg>
            <svg class="i-fsx" viewBox="0 0 24 24"><path d="M8 5h2v5H5V8h3zM14 5h2v3h3v2h-5zM5 14h5v5H8v-3H5zM14 14h5v2h-3v3h-2z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <h2 class="title" id="title">Vuelo 1</h2>
  </section>

  <aside class="list" id="list" aria-label="Lista de vuelos"></aside>
</main>

<script src="script.js"></script>
</body>
</html>
